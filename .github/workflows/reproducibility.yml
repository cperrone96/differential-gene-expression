name: reproducibility

on:
  push:
  pull_request:

jobs:
  fast-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python analysis.py --seed 2024 --repeats 3 --output-dir /tmp/dge-outputs
      - run: pytest -q
